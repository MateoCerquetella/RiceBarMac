name: RiceBarMac
options:
    minimumXcodeGenVersion: 2.45.4
    xcodeVersion: '15.4'
    projectFormat: xcode15_3
    bundleIdPrefix: com.mateocerquetella
    developmentLanguage: en
    deploymentTarget:
        macOS: '14.0'
packages:
    HotKey:
        url: https://github.com/soffes/HotKey.git
        version: 0.2.1
    Yams:
        url: https://github.com/jpsim/Yams.git
        version: 5.4.0
settings:
    base:
        DEVELOPMENT_TEAM: ''
        MARKETING_VERSION: '0.20'
        CURRENT_PROJECT_VERSION: '120'
        ARCHS: 'x86_64 arm64'
targets:
    RiceBarMac:
        type: application
        platform: macOS
        deploymentTarget: '14.0'
        sources:
            - path: App/Sources
            - path: App/Assets.xcassets
        settings:
            base:
                PRODUCT_NAME: RiceBarMac
                PRODUCT_BUNDLE_IDENTIFIER: com.mateocerquetella.RiceBarMac
                CODE_SIGN_STYLE: Automatic
                SWIFT_VERSION: 5.9
                INFOPLIST_FILE: App/Info.plist
                ENABLE_HARDENED_RUNTIME: YES
                ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                ARCHS: 'x86_64 arm64'
                ONLY_ACTIVE_ARCH: NO
            configs:
                Debug:
                    CODE_SIGN_ENTITLEMENTS: App/Entitlements/RiceBarMac_Debug.entitlements
                    ENABLE_HARDENED_RUNTIME: NO
                    ONLY_ACTIVE_ARCH: YES
                Release:
                    CODE_SIGN_ENTITLEMENTS: App/Entitlements/RiceBarMac_Release.entitlements
                    ENABLE_HARDENED_RUNTIME: YES
                    ONLY_ACTIVE_ARCH: NO
        info:
            path: App/Info.plist
            properties:
                CFBundleName: RiceBarMac
                CFBundleDisplayName: RiceBarMac
                CFBundleIdentifier: com.mateocerquetella.RiceBarMac
                CFBundleVersion: $(CURRENT_PROJECT_VERSION)
                CFBundleShortVersionString: $(MARKETING_VERSION)
                LSApplicationCategoryType: public.app-category.utilities
                LSMinimumSystemVersion: '14.0'
                LSUIElement: true
                NSDesktopFolderUsageDescription: RiceBarMac needs access to change your desktop wallpaper.
        dependencies:
            - package: HotKey
              product: HotKey
            - package: Yams
              product: Yams
    RiceBarMacTests:
        type: bundle.unit-test
        platform: macOS
        deploymentTarget: '14.0'
        sources:
            - path: App/Tests
        dependencies:
            - target: RiceBarMac
        settings:
            base:
                PRODUCT_BUNDLE_IDENTIFIER: com.mateocerquetella.RiceBarMacTests
                GENERATE_INFOPLIST_FILE: YES
    RiceBarMacUITests:
        type: bundle.ui-testing
        platform: macOS
        deploymentTarget: '14.0'
        sources:
            - path: App/UITests
        dependencies:
            - target: RiceBarMac
        settings:
            base:
                PRODUCT_BUNDLE_IDENTIFIER: com.mateocerquetella.RiceBarMacUITests
                GENERATE_INFOPLIST_FILE: YES
                TEST_TARGET_NAME: RiceBarMac
schemes:
    RiceBarMac:
        build:
            targets:
                RiceBarMac: all
        run:
            config: Debug
        test:
            config: Debug
            gatherCoverageData: true
            targets:
                - name: RiceBarMacTests
                - name: RiceBarMacUITests
        archive:
            config: Release
